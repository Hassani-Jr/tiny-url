name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push lands —
# keeps PR feedback fast and saves runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fail loud if anyone commits unformatted code. `gofmt -l` lists files
      # that need formatting; piping through `! grep .` flips the exit code
      # so a non-empty list fails the step.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Race detector catches concurrency bugs in middleware (rate limiter,
      # request ID, click-recording transactions) that the regular suite
      # would only hit by luck. Modern CI runners can afford it.
      - name: go test (with race detector)
        run: go test -race -cover ./...

      - name: go build
        run: go build ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No push — the goal here is to catch Dockerfile regressions, not to
      # publish images. A registry/push step belongs in a separate release
      # workflow gated on tags.
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tiny-url:ci
          # Inject the SHA so `tiny-url --version` inside the image
          # reports the right commit — the Docker build context omits
          # .git so ReadBuildInfo can't otherwise recover it.
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fuzz:
    name: fuzz validators (60s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Short bursts — enough to catch new regressions, not enough to bog
      # down PR feedback. Seed corpus + ~60s of mutation per fuzzer is the
      # sweet spot for input-parser fuzzing in CI.
      - name: fuzz ValidateDestinationURL
        run: go test ./services/ -run='^$' -fuzz=FuzzValidateDestinationURL -fuzztime=60s

      - name: fuzz ValidateCustomCode
        run: go test ./services/ -run='^$' -fuzz=FuzzValidateCustomCode -fuzztime=60s

      # Surface fuzz-generated corpus on failure so an operator can
      # reproduce locally with `go test -run=FuzzXxx/<hash>`.
      - name: upload fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: services/testdata/fuzz/
